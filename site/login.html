<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Flor Em Tina</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 18px;
            color: var(--text-light);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        #googleBtnContainer {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo">
            <div class="logo-icon">🌸</div>
            <div class="logo-text"><h1>Flor Em Tina</h1><span>Plantas & Jardim</span></div>
        </a>
        <nav>
            <a href="index.html">← Voltar à loja</a>
        </nav>
    </div>
</header>

<div class="form-card">
    <h2>Bem-vindo de volta 🌿</h2>
    <p class="subtitle">Acesse sua conta para acompanhar pedidos.</p>

    <div id="googleBtnContainer"></div>
    <div id="googleNotConfigured" class="muted text-center" style="display:none; font-size: 0.8rem; margin-bottom: 12px;">
        ℹ️ Login com Google indisponível (configure <code>GOOGLE_CLIENT_ID</code> no servidor)
    </div>

    <div class="divider">ou entre com e-mail</div>

    <form id="loginForm" autocomplete="on">
        <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="seuemail@exemplo.com">
        </div>
        <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" required minlength="6" placeholder="••••••••">
        </div>
        <div class="error-msg" id="err"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 8px;" id="submitBtn">Entrar</button>
    </form>

    <p class="muted text-center mt-24">
        Não tem cadastro? <a href="register.html" style="color: var(--green-dark); font-weight: 600;">Criar conta</a>
    </p>
</div>

<script src="api.js"></script>
<script>
const form = document.getElementById('loginForm');
const errEl = document.getElementById('err');
const btn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        await API.login(email, password);
        const next = getQuery('next') || (API.isAdmin() ? 'admin.html' : 'index.html');
        location.href = next;
    } catch (e) {
        errEl.textContent = e.message || 'Falha no login.';
        errEl.classList.add('show');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
    }
});

if (API.user()) {
    const next = getQuery('next');
    if (next) location.href = next;
}

// === Google Sign-In ===
async function setupGoogle() {
    let config;
    try {
        config = await API.googleConfig();
    } catch(e) {
        document.getElementById('googleNotConfigured').style.display = 'block';
        return;
    }
    if (!config.client_id) {
        document.getElementById('googleNotConfigured').style.display = 'block';
        return;
    }
    function init() {
        if (typeof google === 'undefined' || !google.accounts) {
            setTimeout(init, 200);
            return;
        }
        google.accounts.id.initialize({
            client_id: config.client_id,
            callback: handleGoogleCredential,
            auto_select: false,
            cancel_on_tap_outside: true,
        });
        google.accounts.id.renderButton(
            document.getElementById('googleBtnContainer'),
            { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 320 }
        );
        google.accounts.id.prompt();
    }
    init();
}
async function handleGoogleCredential(resp) {
    errEl.classList.remove('show');
    btn.disabled = true;
    btn.textContent = 'Entrando com Google...';
    try {
        const r = await API.googleLogin(resp.credential);
        const next = getQuery('next') || (r.user.role === 'admin' ? 'admin.html' : 'index.html');
        location.href = next;
    } catch (e) {
        errEl.textContent = e.message || 'Falha no login com Google.';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Entrar';
    }
}
setupGoogle();
</script>

</body>
</html>
