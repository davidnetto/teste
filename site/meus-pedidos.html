<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos — Flor Em Tina</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="header-inner">
        <a href="index.html" class="logo">
            <div class="logo-icon">🌸</div>
            <div class="logo-text"><h1>Flor Em Tina</h1><span>Meus Pedidos</span></div>
        </a>
        <nav>
            <a href="index.html">Loja</a>
            <a href="#" onclick="API.logout(); location.href='login.html'; return false;">Sair</a>
        </nav>
    </div>
</header>

<div style="max-width: 1100px; margin: 24px auto; padding: 0 24px;">
    <h2 style="font-family: 'Playfair Display', serif; color: var(--green-dark); margin-bottom: 20px;">Seus pedidos</h2>
    <div id="ordersList">
        <p class="muted">Carregando...</p>
    </div>
</div>

<script src="api.js"></script>
<script>
if (!requireAuth(false)) throw new Error('not authed');

async function load() {
    try {
        const orders = await API.myOrders();
        const wrap = document.getElementById('ordersList');
        if (!orders.length) {
            wrap.innerHTML = '<p class="muted">Você ainda não fez pedidos. <a href="index.html" style="color: var(--green-dark); font-weight: 600;">Ver loja</a></p>';
            return;
        }
        wrap.innerHTML = '';
        orders.forEach(o => {
            const card = document.createElement('div');
            card.style.cssText = 'background:white; border-radius:16px; padding:18px 22px; box-shadow:var(--shadow); margin-bottom:14px;';
            const payBadge = o.payment_status === 'paid'
                ? '<span class="badge paid">Pago</span>'
                : '<span class="badge pending">Pendente</span>';
            const statusBadge = `<span class="badge ${o.status}">${o.status}</span>`;
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                    <div>
                        <div style="font-weight:700;">Pedido #${o.id.substring(0,8)}</div>
                        <small class="muted">${new Date(o.created_at).toLocaleString('pt-BR')}</small>
                    </div>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        ${payBadge} ${statusBadge}
                    </div>
                    <div style="font-size:1.1rem; font-weight:700; color:var(--green-dark);">${formatBRL(o.total_cents)}</div>
                </div>
            `;
            wrap.appendChild(card);
        });
    } catch (e) {
        document.getElementById('ordersList').innerHTML = '<p style="color:var(--red);">' + escapeHTML(e.message) + '</p>';
    }
}
load();
</script>
</body>
</html>
