version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: florentina-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-userapi}
    # Porta NÃO exposta ao host; apenas a rede interna acessa o banco.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build: .
    container_name: florentina-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=host=db port=5432 user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:-postgres} dbname=${POSTGRES_DB:-userapi} sslmode=disable
    depends_on:
      - db
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
